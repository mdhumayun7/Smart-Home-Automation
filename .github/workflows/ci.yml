name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Firmware host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Wokwi circuit JSON
        run: python3 -c "import json; json.load(open('wokwi/diagram.json'))"
      - name: Run firmware logic tests
        run: ./tests/host/run_tests.sh

  esp32-build:
    name: ESP32 build (arduino-esp32 ${{ matrix.core }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2.0.17"
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
                version: 2.0.17
          - core: "3.3.12"
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
                version: 3.3.12
    steps:
      - uses: actions/checkout@v5
      - name: Compile firmware for ESP32 DevKit
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: ${{ matrix.platforms }}
          libraries: |
            - name: Adafruit SSD1306
            - name: Adafruit GFX Library
            - name: PubSubClient
          sketch-paths: |
            - firmware/smart_home
          cli-compile-flags: |
            - --warnings="all"
          enable-warnings-report: true
          sketches-report-path: sketches-reports
      - name: Report flash and RAM usage
        env:
          CORE: ${{ matrix.core }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          def walk(node):
              if isinstance(node, dict):
                  if "name" in node and "current" in node and "maximum" in node:
                      yield node
                  for v in node.values():
                      yield from walk(v)
              elif isinstance(node, list):
                  for v in node:
                      yield from walk(v)
          seen = set()
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### ESP32 build, arduino-esp32 {os.environ['CORE']}\n")
              for f in glob.glob("sketches-reports/*.json"):
                  for s in walk(json.load(open(f))):
                      cur, mx = s["current"].get("absolute"), s["maximum"]
                      if s["name"] in seen or not isinstance(cur, int):
                          continue
                      seen.add(s["name"])
                      line = f"{s['name']}: {cur} of {mx} bytes ({100 * cur / mx:.1f} %)"
                      print(f"::notice title=ESP32 {os.environ['CORE']}::{line}")
                      out.write(f"- {line}\n")
          PY
      - name: Upload size report
        uses: actions/upload-artifact@v5
        with:
          name: size-report-${{ matrix.core }}
          path: sketches-reports
