name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Firmware host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Wokwi circuit JSON
        run: python3 -c "import json; json.load(open('wokwi/diagram.json'))"
      - name: Run firmware logic tests
        run: ./tests/host/run_tests.sh

  esp32-build:
    name: ESP32 build (arduino-esp32 ${{ matrix.core }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2.0.17"
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
                version: 2.0.17
          - core: "3.3.12"
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
                version: 3.3.12
    steps:
      - uses: actions/checkout@v5
      - name: Compile firmware for ESP32 DevKit
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: ${{ matrix.platforms }}
          libraries: |
            - name: Adafruit SSD1306
            - name: Adafruit GFX Library
            - name: PubSubClient
          sketch-paths: |
            - firmware/smart_home
            - firmware/espnow_receiver
          cli-compile-flags: |
            - --warnings="all"
          enable-warnings-report: true
          sketches-report-path: sketches-reports
      - name: Report flash and RAM usage
        env:
          CORE: ${{ matrix.core }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          def walk(node):
              if isinstance(node, dict):
                  if "name" in node and "current" in node and "maximum" in node:
                      yield node
                  for v in node.values():
                      yield from walk(v)
              elif isinstance(node, list):
                  for v in node:
                      yield from walk(v)
          seen = set()
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### ESP32 build, arduino-esp32 {os.environ['CORE']}\n")
              for f in glob.glob("sketches-reports/*.json"):
                  for s in walk(json.load(open(f))):
                      cur, mx = s["current"].get("absolute"), s["maximum"]
                      if s["name"] in seen or not isinstance(cur, int):
                          continue
                      seen.add(s["name"])
                      line = f"{s['name']}: {cur} of {mx} bytes ({100 * cur / mx:.1f} %)"
                      print(f"::notice title=ESP32 {os.environ['CORE']}::{line}")
                      out.write(f"- {line}\n")
          PY
      - name: Upload size report
        uses: actions/upload-artifact@v5
        with:
          name: size-report-${{ matrix.core }}
          path: sketches-reports
      - name: Compile with optional features on (ESP-NOW, radar fusion, signed commands)
        if: matrix.core == '3.3.12'
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          sketch-paths: |
            - firmware/smart_home
          cli-compile-flags: |
            - --build-property
            - compiler.cpp.extra_flags=-DENABLE_ESPNOW=1 -DFUSION_MODE=FUSION_AND -DAUTH_COMMANDS=1 -DSECRET_CMD_KEY='"test-key-not-the-demo-key"'

      # Measure the static cost of transport security. This is the only TLS figure this
      # project reports: the host harness has no TLS implementation, so no runtime latency
      # or throughput cost can be measured there. Flash and RAM here are measured by the
      # real compiler and describe the binary, not the running device.
      - name: Measure the build cost of TLS (MQTT_USE_TLS=1)
        if: matrix.core == '3.3.12'
        run: cp firmware/smart_home/secrets.example.h firmware/smart_home/secrets.h
      - name: Compile with TLS enabled
        if: matrix.core == '3.3.12'
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          sketch-paths: |
            - firmware/smart_home
          cli-compile-flags: |
            - --build-property
            - compiler.cpp.extra_flags=-DMQTT_USE_TLS=1
          enable-warnings-report: true
          sketches-report-path: tls-report
      - name: Report TLS flash and RAM delta
        if: matrix.core == '3.3.12'
        run: |
          rm -f firmware/smart_home/secrets.h
          python3 - <<'PY'
          import glob, json, os
          def walk(node):
              if isinstance(node, dict):
                  if "name" in node and "current" in node and "maximum" in node:
                      yield node
                  for v in node.values():
                      yield from walk(v)
              elif isinstance(node, list):
                  for v in node:
                      yield from walk(v)
          seen = set()
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Build cost with MQTT_USE_TLS=1 (arduino-esp32 3.3.12)\n")
              for f in glob.glob("tls-report/*.json"):
                  for s in walk(json.load(open(f))):
                      cur, mx = s["current"].get("absolute"), s["maximum"]
                      if s["name"] in seen or not isinstance(cur, int):
                          continue
                      seen.add(s["name"])
                      line = f"{s['name']}: {cur} of {mx} bytes ({100 * cur / mx:.1f} %)"
                      print(f"::notice title=TLS build::{line}")
                      out.write(f"- {line}\n")
              out.write("\nStatic size only. No runtime TLS cost is measured anywhere in this project.\n")
          PY

  formal-verification:
    name: Formal verification (TLA+)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Model-check the alarm state machine with TLC
        run: ./formal/run_tlc.sh

  experiments:
    name: Adversarial campaign and fuzzing (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run a reduced campaign and fuzz run
        env:
          TRIALS: "300"
          FUZZ_ITERS: "200000"
        run: ./experiments/run.sh
      - name: Fail if any invariant was violated or any fuzz input was accepted
        run: |
          python3 - <<'PY'
          import json, sys
          s = json.load(open("experiments/results/summary.json"))
          bad = 0
          for b in ("baseline", "hardened"):
              for r in s[b]["rates"].values():
                  bad += r["violations"] + r["attacker_disarmed"]
          fuzz = json.load(open("experiments/results/fuzz.json"))
          if fuzz["accepted"] or fuzz["counter_advanced"]:
              bad += 1
          print("violations+disarms+fuzz_accept =", bad)
          sys.exit(1 if bad else 0)
          PY

  ablation:
    name: Ablation and sensitivity (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run a reduced ablation and sensitivity sweep
        env:
          TRIALS: "60"
          SENS_RUNS: "200"
        run: ./experiments/run_ablation.sh
      - name: Check the ablation still discriminates between the designs
        run: |
          python3 - <<'PY'
          import json, sys
          s = json.load(open("experiments/results/ablation_summary.json"))["ablation"]
          problems = []

          # The hardened design must never be defeated by replay and must never lose
          # the legitimate command, at any attack rate.
          h = s["hmac"]
          if h["attacker_replay_armed"]:
              problems.append(f"hmac defeated by replay in {h['attacker_replay_armed']} trials")
          if h["legit_admitted_flooded"] != h["legit_attempts_flooded"]:
              problems.append("hmac lost a legitimate command under flood")

          # Every design must keep the safety function working: that is the isolation claim.
          for name, d in s.items():
              if d["violations"]:
                  problems.append(f"{name}: {d['violations']} invariant violations")
              if d["reached_alarm"] != d["intrusion_test_valid"]:
                  problems.append(f"{name}: alarm did not fire in every valid intrusion trial")

          # The ablation is only informative if it still separates the designs. If a weaker
          # design stops being defeated by replay, the experiment has silently stopped testing
          # what it claims to test.
          if not s["token"]["attacker_replay_armed"]:
              problems.append("token design no longer defeated by replay: ablation lost its discriminator")

          print("\n".join(problems) if problems else "ablation OK")
          sys.exit(1 if problems else 0)
          PY
