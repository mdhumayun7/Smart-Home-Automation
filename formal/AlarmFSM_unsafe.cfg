\* TLC configuration for the DEFECTIVE build: ALLOW_REMOTE_DISARM with no application-layer
\* authentication. TLC is expected to REPORT A VIOLATION of NoUnauthRemoteDisarm here. A run
\* that passes means the specification has stopped modelling the defect, which is a regression.
SPECIFICATION Spec

CONSTANTS
  MaxCtr = 4
  AllowUnauthDisarm = TRUE

INVARIANT TypeOK
INVARIANT NoUnauthRemoteDisarm
INVARIANT NoAlarmWhenDisarmed
