<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1190" viewBox="0 0 1100 1190" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>System architecture: safety core, network core and the queues between them</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="550" y="28" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ESP32 firmware v2.2.0: the safety logic runs on core 1, all networking on core 0.</text><text x="550" y="48" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">The two share nothing but two bounded queues.</text><rect x="36" y="70" width="1028" height="140" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="50" y="94" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">SENSING (inputs)</text><rect x="60" y="108" width="316" height="86" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="218" y="134" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">PIR motion sensor</text><text x="218" y="156" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">HC-SR501, OUT on GPIO 13</text><text x="218" y="176" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">10 s warm-up, 150 ms confirm</text><rect x="392" y="108" width="316" height="86" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="550" y="134" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Door / window switch</text><text x="550" y="156" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">reed or slide switch, GPIO 14</text><text x="550" y="176" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">internal pull-up; HIGH = open</text><rect x="724" y="108" width="316" height="86" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="882" y="134" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">ARM / DISARM button</text><text x="882" y="156" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">momentary, GPIO 27</text><text x="882" y="176" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">internal pull-up; LOW = pressed</text><path d="M218 194 L218 230" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M550 194 L550 230" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M882 194 L882 230" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><rect x="36" y="230" width="1028" height="560" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="2.2"/><text x="50" y="256" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">ESP32 DevKit  —  dual core, FreeRTOS</text><rect x="48" y="270" width="556" height="512" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="62" y="294" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">Core 1: safety loop (Arduino loop task)</text><text x="62" y="314" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">never blocks, watchdog-supervised, works offline</text><rect x="60" y="328" width="532" height="88" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="326" y="352" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">1. Input conditioning</text><text x="326" y="374" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">debounce 40 ms on the door and the button</text><text x="326" y="394" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">PIR: 10 s warm-up, 150 ms confirm</text><rect x="60" y="432" width="532" height="154" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="326" y="456" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">2. State machine</text><text x="326" y="478" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">DISARMED → EXIT_DELAY 10 s → ARMED</text><text x="326" y="498" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ARMED + motion or door → ENTRY_DELAY 10 s</text><text x="326" y="518" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ENTRY_DELAY expires → ALARM 30 s → ARMED</text><text x="326" y="538" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">button arms and disarms; remote: ARM, DISARM, STATUS</text><text x="326" y="558" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">armed state kept in NVS across power cuts</text><rect x="60" y="602" width="532" height="88" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="326" y="626" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">3. Output driver</text><text x="326" y="648" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">buzzer tone 2.7 kHz, two LEDs,</text><text x="326" y="668" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">OLED refresh every 250 ms (4 Hz)</text><rect x="618" y="400" width="124" height="76" rx="10" fill="#F1EAFB" stroke="#2F3A45" stroke-width="1.6"/><text x="680" y="424" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Command</text><text x="680" y="446" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">queue</text><text x="680" y="466" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">4 deep</text><rect x="618" y="520" width="124" height="96" rx="10" fill="#F1EAFB" stroke="#2F3A45" stroke-width="1.6"/><text x="680" y="544" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Event</text><text x="680" y="566" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">queue</text><text x="680" y="586" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">16 deep</text><text x="680" y="606" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">drop oldest</text><path d="M756 438 L744 438" fill="none" stroke="#2F3A45" stroke-width="2.2" marker-end="url(#arr)"/><path d="M616 438 L604 438" fill="none" stroke="#2F3A45" stroke-width="2.2" marker-end="url(#arr)"/><path d="M604 568 L616 568" fill="none" stroke="#2F3A45" stroke-width="2.2" marker-end="url(#arr)"/><path d="M744 568 L756 568" fill="none" stroke="#2F3A45" stroke-width="2.2" marker-end="url(#arr)"/><rect x="756" y="270" width="296" height="512" rx="10" fill="#E8F1FB" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="770" y="294" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">Core 0: network task</text><text x="770" y="314" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">slow DNS or TCP can never</text><text x="770" y="334" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">stall the alarm</text><rect x="768" y="346" width="272" height="86" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="904" y="370" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Wi-Fi manager</text><text x="904" y="392" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">retry every 15 s</text><text x="904" y="412" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">NTP clock (IST)</text><rect x="768" y="446" width="272" height="126" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="904" y="470" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">MQTT client</text><text x="904" y="492" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Last Will “offline”</text><text x="904" y="512" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">reconnect every 5 s</text><text x="904" y="532" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">subscribes to .../cmd</text><text x="904" y="552" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Home Assistant discovery</text><rect x="768" y="586" width="272" height="126" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="904" y="610" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Event publisher</text><text x="904" y="632" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">JSON events, sequence no.</text><text x="904" y="652" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">oldest first</text><text x="904" y="672" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">retained state,</text><text x="904" y="692" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">heartbeat every 30 s</text><path d="M326 690 L326 822" fill="none" stroke="#2F3A45" stroke-width="2.2" marker-end="url(#arr)"/><rect x="36" y="822" width="596" height="168" rx="10" fill="#FFF4E0" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="50" y="846" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">LOCAL OUTPUTS</text><rect x="48" y="860" width="184" height="112" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="140" y="886" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Buzzer</text><text x="140" y="908" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">passive piezo</text><text x="140" y="928" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">GPIO 23</text><text x="140" y="948" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">2.7 kHz</text><rect x="244" y="860" width="184" height="112" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="336" y="886" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Status LEDs</text><text x="336" y="908" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">green GPIO 26</text><text x="336" y="928" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">red GPIO 25</text><rect x="440" y="860" width="184" height="112" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="532" y="886" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">OLED SSD1306</text><text x="532" y="908" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">I2C 0x3C</text><text x="532" y="928" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">GPIO 21 / 22</text><path d="M904 790 L904 860" fill="none" stroke="#2F3A45" stroke-width="2.2" marker-end="url(#arr)"/><text x="904" y="812" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Wi-Fi, MQTT 1883 / 8883 TLS</text><rect x="652" y="822" width="412" height="346" rx="10" fill="#F2F4F7" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="666" y="846" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">NETWORK AND USER SIDE</text><rect x="664" y="860" width="388" height="132" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="858" y="884" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">MQTT broker</text><text x="858" y="906" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">default: public test broker</text><text x="858" y="926" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">evaluated against a private broker</text><text x="858" y="946" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">with TLS, per-client ACLs, credentials</text><text x="858" y="966" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">topics: availability, state, event, cmd</text><path d="M820 992 L820 1032" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M896 1032 L896 992" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><text x="806" y="1018" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#4A5560">state, events</text><text x="910" y="1018" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">commands</text><rect x="664" y="1032" width="388" height="124" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="858" y="1056" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Homeowner clients</text><text x="858" y="1078" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Home Assistant / Node-RED / dashboard</text><text x="858" y="1098" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">phone MQTT app: alert on an alarm event</text><rect x="36" y="1002" width="596" height="166" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="50" y="1026" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">LEGEND</text><rect x="56" y="1040" width="28" height="15" rx="3" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="94" y="1053" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Sensing</text><rect x="56" y="1061" width="28" height="15" rx="3" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="94" y="1074" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Safety core (core 1)</text><rect x="56" y="1082" width="28" height="15" rx="3" fill="#E8F1FB" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="94" y="1095" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Network core (core 0)</text><rect x="56" y="1103" width="28" height="15" rx="3" fill="#F1EAFB" stroke="#2F3A45" stroke-width="1.6"/><text x="94" y="1116" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Shared queues</text><rect x="56" y="1124" width="28" height="15" rx="3" fill="#FFF4E0" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="94" y="1137" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Local outputs</text><rect x="56" y="1145" width="28" height="15" rx="3" fill="#F2F4F7" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="94" y="1158" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Network and user side</text><text x="316" y="1052" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">Events raised while offline wait in</text><text x="316" y="1072" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">the queue (up to 16) and are sent on</text><text x="316" y="1092" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">reconnect. A remote DISARM needs a</text><text x="316" y="1112" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">valid HMAC tag over a fresh,</text><text x="316" y="1132" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">NVS-persisted counter.</text></svg>