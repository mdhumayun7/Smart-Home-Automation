<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1190" viewBox="0 0 1100 1190" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"><title>Smart Home Surveillance System v2 architecture</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="550" y="38" font-size="23" font-weight="bold" text-anchor="middle" fill="#1B1F23">Smart Home Surveillance System v2 - System Architecture</text><text x="550" y="62" font-size="14" font-weight="normal" text-anchor="middle" fill="#4A5560">ESP32 firmware v2.0.0: safety logic on core 1, networking on core 0</text><text x="30" y="100" font-size="13" font-weight="bold" text-anchor="start" fill="#2B6CB0">SENSING (inputs)</text><rect x="30" y="112" width="330" height="92" rx="8" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.6"/><text x="195.0" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">PIR motion sensor</text><text x="195.0" y="160" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">HC-SR501, output on GPIO13</text><path d="M195 204 L195 222" fill="none" stroke="#2B6CB0" stroke-width="2"/><rect x="385" y="112" width="330" height="92" rx="8" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.6"/><text x="550.0" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">Door / window switch</text><text x="550.0" y="160" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">slide or reed switch, GPIO14</text><text x="550.0" y="180" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">internal pull-up, HIGH = open</text><path d="M550 204 L550 222" fill="none" stroke="#2B6CB0" stroke-width="2"/><rect x="740" y="112" width="330" height="92" rx="8" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.6"/><text x="905.0" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">ARM / DISARM button</text><text x="905.0" y="160" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">momentary, GPIO27</text><text x="905.0" y="180" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">internal pull-up, LOW = pressed</text><path d="M905 204 L905 222" fill="none" stroke="#2B6CB0" stroke-width="2"/><path d="M195 222 L905 222" fill="none" stroke="#2B6CB0" stroke-width="2"/><path d="M285 222 L285 330" fill="none" stroke="#2B6CB0" stroke-width="2" marker-end="url(#arr)"/><rect x="30" y="236" width="1040" height="584" rx="12" fill="#FBFBFC" stroke="#2F3A45" stroke-width="2"/><text x="46" y="262" font-size="16" font-weight="bold" text-anchor="start" fill="#2F3A45">ESP32 DevKit (dual core, FreeRTOS)</text><rect x="50" y="276" width="470" height="524" rx="12" fill="#E9F7EF" stroke="#2E7D32" stroke-width="2"/><text x="66" y="302" font-size="16" font-weight="bold" text-anchor="start" fill="#2E7D32">Core 1: safety loop (Arduino loop task)</text><text x="66" y="322" font-size="13" font-weight="normal" text-anchor="start" fill="#4A5560">never blocks, keeps working with Wi-Fi down</text><rect x="70" y="330" width="430" height="100" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="285.0" y="358" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">1. Input conditioning</text><text x="285.0" y="378" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">debounce 40 ms on door and button</text><text x="285.0" y="398" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">PIR: 10 s warm-up, 150 ms confirm</text><rect x="70" y="460" width="430" height="200" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="285.0" y="488" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">2. State machine</text><text x="285.0" y="508" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">DISARMED &gt; EXIT_DELAY 10 s &gt; ARMED</text><text x="285.0" y="528" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">ARMED + motion / door &gt; ENTRY_DELAY 10 s</text><text x="285.0" y="548" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">ENTRY_DELAY expires &gt; ALARM 30 s &gt; ARMED</text><text x="285.0" y="568" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">button arms / disarms; remote: ARM, STATUS</text><rect x="70" y="690" width="430" height="90" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="285.0" y="718" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">3. Output driver</text><text x="285.0" y="738" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">buzzer tone 2.7 kHz, 2 LEDs, OLED at 4 Hz</text><path d="M285 430 L285 460" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><path d="M285 660 L285 690" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><rect x="530" y="470" width="120" height="80" rx="8" fill="#F1EAFB" stroke="#6B46C1" stroke-width="1.6"/><text x="590.0" y="496" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F23">Command</text><text x="590.0" y="515" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">queue, 4 deep</text><rect x="530" y="600" width="120" height="80" rx="8" fill="#F1EAFB" stroke="#6B46C1" stroke-width="1.6"/><text x="590.0" y="626" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F23">Event queue</text><text x="590.0" y="645" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">16 deep</text><text x="590.0" y="664" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">drop oldest</text><rect x="660" y="276" width="390" height="524" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="2"/><text x="676" y="302" font-size="16" font-weight="bold" text-anchor="start" fill="#B26A00">Core 0: network task</text><text x="676" y="322" font-size="13" font-weight="normal" text-anchor="start" fill="#4A5560">slow DNS / TCP can never stall the alarm</text><rect x="680" y="330" width="350" height="90" rx="8" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.6"/><text x="855.0" y="358" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">Wi-Fi manager</text><text x="855.0" y="378" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">retry every 15 s, NTP clock (IST)</text><rect x="680" y="450" width="350" height="120" rx="8" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.6"/><text x="855.0" y="478" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">MQTT client</text><text x="855.0" y="498" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">Last Will "offline", reconnect every 5 s</text><text x="855.0" y="518" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">subscribes to .../cmd</text><rect x="680" y="600" width="350" height="110" rx="8" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.6"/><text x="855.0" y="628" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">Event publisher</text><text x="855.0" y="648" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">JSON events, oldest first</text><text x="855.0" y="668" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">retained state + 30 s heartbeat</text><path d="M855 420 L855 450" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><path d="M855 600 L855 570" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><path d="M680 510 L650 510" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><path d="M530 510 L500 510" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><path d="M500 640 L530 640" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><path d="M650 640 L680 640" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="867" y="590" font-size="12" font-weight="normal" text-anchor="start" fill="#4A5560">publish</text><text x="30" y="842" font-size="13" font-weight="bold" text-anchor="start" fill="#C0392B">LOCAL OUTPUTS</text><path d="M285 800 L285 856" fill="none" stroke="#C0392B" stroke-width="2"/><path d="M110 856 L450 856" fill="none" stroke="#C0392B" stroke-width="2"/><rect x="30" y="872" width="160" height="96" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="110.0" y="899" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B1F23">Buzzer</text><text x="110.0" y="918" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">passive piezo</text><text x="110.0" y="937" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">GPIO23</text><path d="M110 856 L110 872" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/><rect x="200" y="872" width="160" height="96" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="280.0" y="899" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B1F23">Status LEDs</text><text x="280.0" y="918" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">green GPIO26</text><text x="280.0" y="937" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">red GPIO25</text><path d="M280 856 L280 872" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/><rect x="370" y="872" width="160" height="96" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="450.0" y="899" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B1F23">OLED SSD1306</text><text x="450.0" y="918" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">I2C 0x3C</text><text x="450.0" y="937" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">GPIO21 / 22</text><path d="M450 856 L450 872" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arr)"/><text x="640" y="842" font-size="13" font-weight="bold" text-anchor="start" fill="#475467">NETWORK AND USER SIDE</text><path d="M855 800 L855 884" fill="none" stroke="#B26A00" stroke-width="2.4" marker-end="url(#arr)"/><text x="865" y="842" font-size="12" font-weight="normal" text-anchor="start" fill="#4A5560">Wi-Fi, MQTT 1883</text><rect x="640" y="886" width="410" height="112" rx="8" fill="#F2F4F7" stroke="#475467" stroke-width="1.6"/><text x="845.0" y="914" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">MQTT broker</text><text x="845.0" y="934" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">demo: broker.hivemq.com (public)</text><text x="845.0" y="954" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">topics: availability, state, event, cmd</text><text x="845.0" y="974" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">deployment: private broker + TLS</text><rect x="640" y="1050" width="410" height="100" rx="8" fill="#F2F4F7" stroke="#475467" stroke-width="1.6"/><text x="845.0" y="1078" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F23">Homeowner clients</text><text x="845.0" y="1098" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">Node-RED flow / MQTT dashboard</text><text x="845.0" y="1118" font-size="14" font-weight="normal" text-anchor="middle" fill="#33393F">phone MQTT app: alert on "alarm" event</text><path d="M780 998 L780 1050" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="770" y="1030" font-size="12" font-weight="normal" text-anchor="end" fill="#4A5560">event, state</text><path d="M920 1050 L920 998" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="930" y="1030" font-size="12" font-weight="normal" text-anchor="start" fill="#4A5560">ARM, STATUS</text><text x="30" y="1010" font-size="13" font-weight="bold" text-anchor="start" fill="#2F3A45">LEGEND</text><rect x="30" y="1030" width="18" height="14" rx="3" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="58" y="1042" font-size="14" font-weight="normal" text-anchor="start" fill="#1B1F23">Sensing</text><rect x="30" y="1054" width="18" height="14" rx="3" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.5"/><text x="58" y="1066" font-size="14" font-weight="normal" text-anchor="start" fill="#1B1F23">Safety core (core 1)</text><rect x="30" y="1078" width="18" height="14" rx="3" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.5"/><text x="58" y="1090" font-size="14" font-weight="normal" text-anchor="start" fill="#1B1F23">Network core (core 0)</text><rect x="30" y="1102" width="18" height="14" rx="3" fill="#F1EAFB" stroke="#6B46C1" stroke-width="1.5"/><text x="58" y="1114" font-size="14" font-weight="normal" text-anchor="start" fill="#1B1F23">Shared queues</text><rect x="30" y="1126" width="18" height="14" rx="3" fill="#FDECEC" stroke="#C0392B" stroke-width="1.5"/><text x="58" y="1138" font-size="14" font-weight="normal" text-anchor="start" fill="#1B1F23">Local outputs</text><rect x="30" y="1150" width="18" height="14" rx="3" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="58" y="1162" font-size="14" font-weight="normal" text-anchor="start" fill="#1B1F23">Cloud / user</text><text x="300" y="1046" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">Events raised while offline wait in the</text><text x="300" y="1064" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">queue (up to 16) and are sent on reconnect.</text><text x="300" y="1090" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">Remote DISARM is refused by default</text><text x="300" y="1108" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">(ALLOW_REMOTE_DISARM = 0).</text></svg>