<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Transport-layer admission against application-layer authorization</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="640" y="36" font-size="22" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Transport security does not supply command authorization</text><text x="640" y="60" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">The broker terminates TLS and re-originates every message, so an arriving command carries no evidence of who published it.</text><text x="640" y="80" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Broker credentials decide admission. Only the command key decides authority.</text><rect x="36" y="110" width="1208" height="268" rx="14" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="56" y="136" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">AUTH_COMMANDS = 1    —  application-layer authentication required</text><text x="56" y="158" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">A command is acted on only if its HMAC-SHA256 tag verifies under SECRET_CMD_KEY and its counter exceeds the value in NVS.</text><text x="181.0" y="186" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Publisher</text><text x="421.0" y="186" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Broker</text><text x="661.0" y="186" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Device check</text><text x="1030.0" y="186" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Outcome</text><rect x="56" y="196" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="181.0" y="222" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Operator</text><text x="181.0" y="242" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">holds credentials and key</text><path d="M306 227.0 L340 227.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="346" y="196" width="150" height="62" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="421.0" y="232.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">admits</text><path d="M496 227.0 L530 227.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="536" y="196" width="250" height="62" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="661.0" y="220" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">tag verifies,</text><text x="661.0" y="240" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">counter advances</text><path d="M786 227.0 L830 227.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="836" y="196" width="388" height="62" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="1030.0" y="232.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">DISARM executes</text><rect x="56" y="276" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="181.0" y="302" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Adversary</text><text x="181.0" y="322" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">leaked credentials, no key</text><path d="M306 307.0 L340 307.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="346" y="276" width="150" height="62" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="421.0" y="312.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">admits</text><path d="M496 307.0 L530 307.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="536" y="276" width="250" height="62" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="661.0" y="300" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">tag fails:</text><text x="661.0" y="320" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">cmd_badmac</text><path d="M786 307.0 L830 307.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="836" y="276" width="388" height="62" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="1030.0" y="312.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">rejected — alarm fires, 300/300 trials</text><rect x="36" y="400" width="1208" height="268" rx="14" fill="#FDF3F2" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="56" y="426" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">ALLOW_REMOTE_DISARM = 1 without AUTH_COMMANDS   —  the guard this work removed</text><text x="56" y="448" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">The guard accepted TLS plus a broker login as sufficient. The HMAC test is short-circuited, so any admitted DISARM is acted on.</text><text x="181.0" y="476" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Publisher</text><text x="421.0" y="476" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Broker</text><text x="661.0" y="476" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Device check</text><text x="1030.0" y="476" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Outcome</text><rect x="56" y="486" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="181.0" y="512" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Operator</text><text x="181.0" y="532" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">holds credentials, no key</text><path d="M306 517.0 L340 517.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="346" y="486" width="150" height="62" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="421.0" y="522.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">admits</text><path d="M496 517.0 L530 517.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="536" y="486" width="250" height="62" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="661.0" y="510" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">no check:</text><text x="661.0" y="530" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">ALLOW_REMOTE_DISARM</text><path d="M786 517.0 L830 517.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="836" y="486" width="388" height="62" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="1030.0" y="522.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">DISARM executes</text><rect x="56" y="566" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="181.0" y="592" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Adversary</text><text x="181.0" y="612" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">leaked credentials, no key</text><path d="M306 597.0 L340 597.0" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="346" y="566" width="150" height="62" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="421.0" y="602.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">admits</text><path d="M496 597.0 L530 597.0" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="536" y="566" width="250" height="62" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="661.0" y="590" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">no check:</text><text x="661.0" y="610" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">ALLOW_REMOTE_DISARM</text><path d="M786 597.0 L830 597.0" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="836" y="566" width="388" height="62" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="1030.0" y="602.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">DISARM executes — alarm fires in only 50/300</text><rect x="36" y="690" width="1208" height="100" rx="14" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="56" y="714" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">Control, identical in both builds</text><rect x="56" y="722" width="250" height="56" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="181.0" y="748" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Adversary</text><text x="181.0" y="768" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">no credentials</text><path d="M306 750.0 L340 750.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="346" y="722" width="150" height="56" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="421.0" y="755.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">refuses</text><text x="661.0" y="755.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">never reached</text><rect x="836" y="722" width="388" height="56" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="1030.0" y="755.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">connection refused — alarm fires, 300/300</text></svg>