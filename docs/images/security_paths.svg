<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="856" viewBox="0 0 1160 856" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Transport-layer admission against application-layer authorization</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><g transform="translate(0,-10)"><text x="580" y="38" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">The broker terminates TLS and re-originates every message, so an arriving command carries no evidence of who published it.</text><text x="580" y="58" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Broker credentials decide admission. Only the command key decides authority.</text><rect x="36" y="70" width="1088" height="340" rx="14" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="48" y="96" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">AUTH_COMMANDS = 1    —  application-layer authentication required</text><text x="48" y="118" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">Acted on only if the HMAC-SHA256 tag verifies under SECRET_CMD_KEY and the counter exceeds the value in NVS.</text><text x="162.0" y="146" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Publisher</text><text x="362.0" y="146" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Broker</text><text x="567.0" y="146" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Device check</text><text x="905.0" y="146" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Outcome</text><rect x="48" y="156" width="228" height="62" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="162.0" y="182" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Operator</text><text x="162.0" y="202" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">credential + key</text><path d="M276 187.0 L290 187.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="296" y="156" width="132" height="62" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="362.0" y="192.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">admits</text><path d="M428 187.0 L442 187.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="448" y="156" width="238" height="62" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="567.0" y="180" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">tag verifies,</text><text x="567.0" y="200" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">counter advances</text><path d="M686 187.0 L700 187.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="706" y="156" width="398" height="62" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="905.0" y="192.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">DISARM executes</text><rect x="48" y="236" width="228" height="62" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="162.0" y="262" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Adversary</text><text x="162.0" y="282" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">credential, no key</text><path d="M276 267.0 L290 267.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="296" y="236" width="132" height="62" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="362.0" y="272.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">admits</text><path d="M428 267.0 L442 267.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="448" y="236" width="238" height="62" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="567.0" y="260" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">tag fails:</text><text x="567.0" y="280" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">cmd_badmac</text><path d="M686 267.0 L700 267.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="706" y="236" width="398" height="62" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="905.0" y="272.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">rejected; alarm fires 300/300</text><rect x="48" y="316" width="228" height="62" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="162.0" y="342" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Adversary</text><text x="162.0" y="362" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">controller cred + key</text><path d="M276 347.0 L290 347.0" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="296" y="316" width="132" height="62" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="362.0" y="352.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">admits</text><path d="M428 347.0 L442 347.0" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="448" y="316" width="238" height="62" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="567.0" y="340" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">tag verifies,</text><text x="567.0" y="360" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">counter advances</text><path d="M686 347.0 L700 347.0" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="706" y="316" width="398" height="62" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="905.0" y="352.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">DISARM executes; alarm fires 50/300</text><text x="580" y="396" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">Row 3 is a compromised controller host: a credential the ACL must permit plus the key. Neither layer refuses it.</text><rect x="36" y="432" width="1088" height="250" rx="14" fill="#FDF3F2" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="48" y="458" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">ALLOW_REMOTE_DISARM = 1 without AUTH_COMMANDS   —  the guard this work removed</text><text x="48" y="480" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">The guard treated TLS plus a broker login as sufficient: the HMAC test is skipped, so any admitted DISARM is acted on.</text><text x="162.0" y="508" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Publisher</text><text x="362.0" y="508" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Broker</text><text x="567.0" y="508" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Device check</text><text x="905.0" y="508" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">Outcome</text><rect x="48" y="518" width="228" height="62" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="162.0" y="544" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Operator</text><text x="162.0" y="564" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">credential, no key</text><path d="M276 549.0 L290 549.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="296" y="518" width="132" height="62" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="362.0" y="554.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">admits</text><path d="M428 549.0 L442 549.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="448" y="518" width="238" height="62" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="567.0" y="542" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">no check:</text><text x="567.0" y="562" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">ALLOW_REMOTE_DISARM</text><path d="M686 549.0 L700 549.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="706" y="518" width="398" height="62" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="905.0" y="554.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">DISARM executes</text><rect x="48" y="598" width="228" height="62" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="162.0" y="624" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Adversary</text><text x="162.0" y="644" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">credential, no key</text><path d="M276 629.0 L290 629.0" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="296" y="598" width="132" height="62" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="362.0" y="634.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">admits</text><path d="M428 629.0 L442 629.0" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="448" y="598" width="238" height="62" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="567.0" y="622" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">no check:</text><text x="567.0" y="642" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">ALLOW_REMOTE_DISARM</text><path d="M686 629.0 L700 629.0" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="706" y="598" width="398" height="62" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="905.0" y="634.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">DISARM executes; alarm fires 50/300</text><rect x="36" y="704" width="1088" height="100" rx="14" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="48" y="728" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">Control, identical in both builds</text><rect x="48" y="736" width="228" height="56" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="162.0" y="762" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Adversary</text><text x="162.0" y="782" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">no credential</text><path d="M276 764.0 L290 764.0" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="296" y="736" width="132" height="56" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="362.0" y="769.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">refuses</text><text x="567.0" y="769.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">never reached</text><rect x="706" y="736" width="398" height="56" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="905.0" y="769.0" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">connection refused; alarm fires 300/300</text><text x="580" y="824" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Outcome colour is the only colour that carries meaning: green, the alarm still protects the house;</text><text x="580" y="844" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">red, an unauthorised DISARM succeeded. Every outcome also states its measured count.</text></g></svg>