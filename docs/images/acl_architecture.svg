<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="686" viewBox="0 0 1160 686" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Per-client topic permissions and trust boundaries</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><g transform="translate(0,-14)"><text x="580" y="38" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Some identity must hold write on the command topic, or the alarm cannot be commanded at all.</text><text x="580" y="58" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Which identity the adversary steals is what decides the outcome.</text><rect x="36" y="72" width="1088" height="214" rx="14" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="48" y="98" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">PER-CLIENT ACL  —  modelled, and reproduced on Mosquitto 2.0.18</text><text x="340" y="130" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">cmd topic: publish</text><text x="620" y="130" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">cmd topic: subscribe</text><text x="900" y="130" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">stat topic: publish</text><text x="146" y="130" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">identity</text><rect x="56" y="160" width="180" height="40" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="146" y="185" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">controller</text><rect x="280" y="160" width="120" height="40" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="340" y="185" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">allow</text><rect x="560" y="160" width="120" height="40" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="620" y="185" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">deny</text><rect x="840" y="160" width="120" height="40" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="900" y="185" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">deny</text><rect x="56" y="208" width="180" height="40" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="146" y="233" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">device</text><rect x="280" y="208" width="120" height="40" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="340" y="233" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">deny</text><rect x="560" y="208" width="120" height="40" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="620" y="233" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">allow</text><rect x="840" y="208" width="120" height="40" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="900" y="233" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">allow</text><text x="580" y="268" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Only the controller may publish commands; the device may only read them.   (Broker usernames: operator, device.)</text><text x="580" y="322" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Which compromise each control contains</text><rect x="40" y="350" width="320" height="176" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="200" y="378" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Device credential</text><text x="200" y="398" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">stolen</text><text x="200" y="426" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">ACL holds</text><text x="200" y="450" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">the device identity has no write</text><text x="200" y="470" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">on the command topic, so the</text><text x="200" y="490" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">broker refuses the publish</text><rect x="420" y="350" width="320" height="176" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/><text x="580" y="378" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Controller credential</text><text x="580" y="398" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">stolen</text><text x="580" y="426" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">ACL fails</text><text x="580" y="450" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">that identity is the one the ACL</text><text x="580" y="470" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">must authorise to publish</text><text x="580" y="490" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">commands</text><rect x="800" y="350" width="320" height="176" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/><text x="960" y="378" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">One shared credential</text><text x="960" y="398" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">stolen</text><text x="960" y="426" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">ACL fails</text><text x="960" y="450" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">it must carry write on the</text><text x="960" y="470" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">command topic, so the</text><text x="960" y="490" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">configuration collapses to no ACL</text><rect x="56" y="548" width="1048" height="124" rx="10" fill="#F1EAFB" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="580" y="574" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">The ACL and the MAC fail under different compromises</text><text x="580" y="598" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">The command key and the device's broker credentials share one flash image, so a flash dump yields both; the ACL</text><text x="580" y="618" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">still refuses that identity, and the layered build holds. A compromised controller host is the opposite case: it</text><text x="580" y="638" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">yields a credential the ACL must permit and the key to sign with, so neither layer refuses it.</text></g></svg>