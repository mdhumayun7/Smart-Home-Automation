<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Per-client topic permissions and trust boundaries</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="600" y="36" font-size="18" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Broker access control and where each compromise stops</text><text x="600" y="60" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Some identity must hold write on the command topic, or the alarm cannot be commanded. Which identity the adversary steals is what decides the outcome.</text><rect x="40" y="100" width="1120" height="214" rx="14" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="60" y="126" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">PER-CLIENT ACL, as modelled</text><text x="330" y="158" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">cmd topic: publish</text><text x="610" y="158" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">cmd topic: subscribe</text><text x="900" y="158" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">stat topic: publish</text><text x="150" y="158" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560" font-weight="bold">identity</text><rect x="60" y="172" width="180" height="40" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="150" y="197" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">controller</text><rect x="270" y="172" width="120" height="40" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="330" y="197" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">allow</text><rect x="550" y="172" width="120" height="40" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="610" y="197" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">deny</text><rect x="840" y="172" width="120" height="40" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="900" y="197" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">deny</text><rect x="60" y="220" width="180" height="40" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="150" y="245" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">device</text><rect x="270" y="220" width="120" height="40" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="330" y="245" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">deny</text><rect x="550" y="220" width="120" height="40" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="610" y="245" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">allow</text><rect x="840" y="220" width="120" height="40" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6"/><text x="900" y="245" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">allow</text><text x="600" y="292" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Only the controller may publish commands. The device may only read them.</text><text x="600" y="352" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Which compromise each control contains</text><rect x="60" y="380" width="320" height="150" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="220" y="408" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Device credential</text><text x="220" y="428" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">stolen</text><text x="220" y="456" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">ACL holds</text><text x="220" y="480" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">the device identity has no write on the</text><text x="220" y="495" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">command topic, so the broker refuses the</text><text x="220" y="510" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">publish</text><rect x="400" y="380" width="320" height="150" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/><text x="560" y="408" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Controller credential</text><text x="560" y="428" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">stolen</text><text x="560" y="456" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">ACL fails</text><text x="560" y="480" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">that identity is the one the ACL must</text><text x="560" y="495" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">authorise to publish commands</text><rect x="740" y="380" width="320" height="150" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/><text x="900" y="408" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">One shared credential</text><text x="900" y="428" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">stolen</text><text x="900" y="456" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">ACL fails</text><text x="900" y="480" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">it must carry write on the command</text><text x="900" y="495" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">topic, so the configuration collapses to</text><text x="900" y="510" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">no ACL</text><rect x="60" y="554" width="1000" height="76" rx="10" fill="#F1EAFB" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="560" y="580" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">A MAC fails under the one compromise the ACL survives</text><text x="560" y="602" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">The command key lives in the same flash image as the device's broker credentials, so a flash dump yields both.</text><text x="560" y="617" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">With an ACL as well, that adversary holds a key it can sign with and a credential the broker will not let it publish commands under.</text></svg>