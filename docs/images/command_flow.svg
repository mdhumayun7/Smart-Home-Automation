<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Command execution flow across the two cores</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="550" y="34" font-size="22" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Command execution flow</text><text x="550" y="56" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Parsing and HMAC verification run on core 0, so a command flood costs the safety core no time.</text><rect x="40" y="80" width="1020" height="300" rx="14" fill="#E8F1FB" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="60" y="104" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">CORE 0  —  network domain  (networkTask, priority 1, 8 KB stack)</text><rect x="40" y="430" width="1020" height="290" rx="14" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="60" y="454" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">CORE 1  —  safety domain  (Arduino loop)</text><rect x="80" y="150" width="150" height="86" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="155.0" y="182" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">MQTT</text><text x="155.0" y="202" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">message</text><rect x="250" y="150" width="150" height="86" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="325.0" y="182" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">topic</text><text x="325.0" y="202" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">filter</text><rect x="420" y="150" width="150" height="86" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="495.0" y="182" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">parse</text><text x="495.0" y="202" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">payload</text><rect x="590" y="150" width="150" height="86" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="665.0" y="182" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">verify</text><text x="665.0" y="202" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">HMAC tag</text><rect x="790" y="150" width="170" height="86" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="875.0" y="182" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">enqueue</text><text x="875.0" y="202" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">cmdQ</text><path d="M230 193 L250 193" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M400 193 L420 193" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M570 193 L590 193" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M740 193 L790 193" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><rect x="300" y="282" width="460" height="72" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="530" y="306" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">rejected on core 0  —  never reaches the safety core</text><text x="530" y="328" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">malformed: dropped silently   ·   bad tag: cmd_badmac   ·   unsigned: cmd_unauth</text><path d="M495 236 L495 282" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><path d="M665 236 L620 282" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="790" y="386" width="170" height="58" rx="8" fill="#B8C4D0" stroke="#2F3A45" stroke-width="1.6"/><text x="875" y="412" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">cmdQ  depth 4</text><text x="875" y="430" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">bounded, non-blocking</text><path d="M875 236 L875 386" fill="none" stroke="#2F3A45" stroke-width="2.4" marker-end="url(#arr)"/><rect x="700" y="470" width="260" height="86" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="830" y="500" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">dequeue, timeout 0</text><text x="830" y="522" font-size="16" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#4A5560">xQueueReceive(cmdQ, &amp;m, 0)</text><text x="830" y="542" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">the safety loop never waits</text><rect x="420" y="470" width="230" height="86" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="535" y="500" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">freshness check</text><text x="535" y="522" font-size="16" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#4A5560">m.ctr &gt; cmdCounter</text><text x="535" y="542" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">else cmd_replay</text><rect x="150" y="470" width="220" height="86" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="260" y="496" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">persist counter</text><text x="260" y="518" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">NVS write BEFORE acting:</text><text x="260" y="536" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">a crash cannot replay</text><rect x="150" y="600" width="500" height="92" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="400" y="626" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">authorise and execute</text><text x="400" y="648" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">DISARM requires m.authed OR ALLOW_REMOTE_DISARM, else cmd_rejected</text><text x="400" y="668" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ARM / ARM_AWAY only from DISARMED, else cmd_ignored   ·   STATUS publishes</text><path d="M700 513 L650 513" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M420 513 L370 513" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M260 556 L260 600" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><rect x="700" y="600" width="260" height="92" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="830" y="626" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">response</text><text x="830" y="648" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">retained state publish</text><text x="830" y="668" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">plus one outcome event</text><text x="830" y="688" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">no acknowledgement protocol</text><path d="M650 646 L700 646" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="550" y="738" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Dashed: rejection and reporting paths.  Solid: the accepted-command path.</text></svg>