<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Command execution sequence: authenticated remote DISARM</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="750.0" y="40" font-size="22" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Smart Home Surveillance System v2 - Command Execution Sequence</text><text x="750.0" y="64" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Authenticated remote DISARM: HMAC-SHA256 over a reboot-persistent counter, verified on core 0</text><path d="M480 108 L480 1005" stroke="#C0392B" stroke-width="2" fill="none" stroke-dasharray="9 6"/><text x="480" y="100" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">TRUST BOUNDARY</text><text x="470" y="1021" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#C0392B">untrusted</text><text x="490" y="1021" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#C0392B">device</text><rect x="12" y="112" width="196" height="48" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="2"/><text x="110" y="134" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Operator</text><text x="110" y="152" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">MQTT client</text><path d="M110 160 L110 995" stroke="#4A5560" stroke-width="1.2" fill="none" stroke-dasharray="5 5"/><rect x="252" y="112" width="196" height="48" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="2"/><text x="350" y="134" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">MQTT broker</text><text x="350" y="152" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">untrusted</text><path d="M350 160 L350 995" stroke="#4A5560" stroke-width="1.2" fill="none" stroke-dasharray="5 5"/><rect x="512" y="112" width="196" height="48" rx="10" fill="#FFF4E0" stroke="#B26A00" stroke-width="2"/><text x="610" y="134" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">networkTask</text><text x="610" y="152" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">core 0</text><path d="M610 160 L610 995" stroke="#4A5560" stroke-width="1.2" fill="none" stroke-dasharray="5 5"/><rect x="782" y="112" width="196" height="48" rx="10" fill="#F1EAFB" stroke="#6B46C1" stroke-width="2"/><text x="880" y="134" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">cmdQ</text><text x="880" y="152" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">depth 4</text><path d="M880 160 L880 995" stroke="#4A5560" stroke-width="1.2" fill="none" stroke-dasharray="5 5"/><rect x="1022" y="112" width="196" height="48" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="2"/><text x="1120" y="134" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">safety loop</text><text x="1120" y="152" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">core 1</text><path d="M1120 160 L1120 995" stroke="#4A5560" stroke-width="1.2" fill="none" stroke-dasharray="5 5"/><rect x="1272" y="112" width="196" height="48" rx="10" fill="#F1EAFB" stroke="#6B46C1" stroke-width="2"/><text x="1370" y="134" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">NVS</text><text x="1370" y="152" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">flash</text><path d="M1370 160 L1370 995" stroke="#4A5560" stroke-width="1.2" fill="none" stroke-dasharray="5 5"/><rect x="104.5" y="205" width="11" height="23" fill="#FFFFFF" stroke="#475467" stroke-width="1.5"/><rect x="344.5" y="208" width="11" height="92" fill="#FFFFFF" stroke="#475467" stroke-width="1.5"/><rect x="604.5" y="283" width="11" height="232" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.5"/><rect x="874.5" y="498" width="11" height="77" fill="#FFFFFF" stroke="#6B46C1" stroke-width="1.5"/><rect x="1114.5" y="556" width="11" height="320" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/><rect x="1364.5" y="682" width="11" height="74" fill="#FFFFFF" stroke="#6B46C1" stroke-width="1.5"/><rect x="604.5" y="856" width="11" height="60" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.5"/><rect x="344.5" y="896" width="11" height="60" fill="#FFFFFF" stroke="#475467" stroke-width="1.5"/><rect x="104.5" y="936" width="11" height="22" fill="#FFFFFF" stroke="#475467" stroke-width="1.5"/><path d="M110 215 L350 215" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><circle cx="126" cy="200" r="10" fill="#1B1F23"/><text x="126" y="204" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#FFFFFF" font-weight="bold">1</text><text x="142" y="204" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">publish  DISARM:1001:&lt;tag&gt;</text><text x="142" y="232" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">tag = HMAC-SHA256(K, msg)[0:16]</text><path d="M350 300 L610 300" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><circle cx="366" cy="285" r="10" fill="#1B1F23"/><text x="366" y="289" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#FFFFFF" font-weight="bold">2</text><text x="382" y="289" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">deliver on  .../cmd</text><rect x="630" y="318" width="220" height="76" rx="8" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.6"/><text x="740.0" y="339" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">verify on core 0</text><text x="740.0" y="357" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">parse VERB:ctr:tag</text><text x="740.0" y="377" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">recompute tag, ct_equal</text><rect x="630" y="410" width="220" height="76" rx="8" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="740.0" y="431" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">rejected, not enqueued</text><text x="740.0" y="449" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">bad tag -&gt; cmd_badmac</text><text x="740.0" y="469" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">unsigned -&gt; cmd_unauth</text><text x="740.0" y="489" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">malformed -&gt; dropped silently</text><path d="M610 515 L880 515" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><circle cx="626" cy="500" r="10" fill="#1B1F23"/><text x="626" y="504" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#FFFFFF" font-weight="bold">3</text><text x="642" y="504" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">enqueue  {DISARM, authed, 1001}</text><text x="642" y="532" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">a flood cannot displace it</text><path d="M880 575 L1120 575" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><circle cx="896" cy="560" r="10" fill="#1B1F23"/><text x="896" y="564" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#FFFFFF" font-weight="bold">4</text><text x="912" y="564" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">xQueueReceive(cmdQ, &amp;m, 0)</text><text x="912" y="592" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">zero timeout: never waits</text><rect x="1140" y="600" width="220" height="58" rx="8" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="1250.0" y="621" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">fresh: ctr &gt; counter</text><text x="1250.0" y="639" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">else cmd_replay</text><path d="M1120 695 L1370 695" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><circle cx="1136" cy="680" r="10" fill="#1B1F23"/><text x="1136" y="684" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#FFFFFF" font-weight="bold">5</text><text x="1152" y="684" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">persistCounter(1001)</text><text x="1152" y="712" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">committed BEFORE acting</text><path d="M1370 756 L1120 756" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><circle cx="1354" cy="741" r="10" fill="#1B1F23"/><text x="1354" y="745" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#FFFFFF" font-weight="bold">6</text><text x="1338" y="745" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#1B1F23">committed</text><rect x="1140" y="778" width="220" height="76" rx="8" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="1250.0" y="799" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">authorise and execute</text><text x="1250.0" y="817" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">m.authed -&gt; disarm()</text><text x="1250.0" y="837" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">DISARMED, 150 ms beep</text><path d="M1120 876 L610 876" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><circle cx="1104" cy="861" r="10" fill="#1B1F23"/><text x="1104" y="865" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#FFFFFF" font-weight="bold">7</text><text x="1088" y="865" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#1B1F23">event: disarmed  (via eventQ)</text><path d="M610 916 L350 916" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><circle cx="594" cy="901" r="10" fill="#1B1F23"/><text x="594" y="905" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#FFFFFF" font-weight="bold">8</text><text x="578" y="905" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#1B1F23">publish event + retained state</text><path d="M350 956 L110 956" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><circle cx="334" cy="941" r="10" fill="#1B1F23"/><text x="334" y="945" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#FFFFFF" font-weight="bold">9</text><text x="318" y="945" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#1B1F23">retained state</text><rect x="50" y="1035" width="1400" height="182" rx="12" fill="#FBFBFC" stroke="#2F3A45" stroke-width="1.6"/><text x="74" y="1061" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">LEGEND</text><rect x="74" y="1083" width="26" height="18" rx="4" fill="#F2F4F7" stroke="#475467" stroke-width="1.6"/><text x="110" y="1097" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Outside the device (untrusted)</text><rect x="404" y="1083" width="26" height="18" rx="4" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.6"/><text x="440" y="1097" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Core 0: network domain</text><rect x="734" y="1083" width="26" height="18" rx="4" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="770" y="1097" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Core 1: safety domain</text><rect x="74" y="1113" width="26" height="18" rx="4" fill="#F1EAFB" stroke="#6B46C1" stroke-width="1.6"/><text x="110" y="1127" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Internal shared resource</text><rect x="404" y="1113" width="26" height="18" rx="4" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="440" y="1127" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">Rejection path</text><path d="M1070 1092 L1130 1092" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><text x="1140" y="1096" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">control flow</text><path d="M1070 1122 L1130 1122" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="1140" y="1126" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">reporting, not control</text><text x="74" y="1163" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">Step 5 commits the counter to flash before the command is acted on, so an interruption can at worst burn a counter value: it cannot leave the command replayable.</text><text x="74" y="1181" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">The operator gets no direct acknowledgement: there is no command-ack protocol, so the outcome is inferred from the retained state topic and the event stream.</text><text x="74" y="1199" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">Steps 7 to 9 are therefore best-effort reporting at MQTT QoS 0 (at-most-once delivery).</text></svg>