<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Sequence diagram: authenticated remote DISARM</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="530" y="34" font-size="18" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Sequence: authenticated remote DISARM</text><rect x="12" y="62" width="156" height="34" rx="8" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="90" y="84" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Operator</text><path d="M90 100 L90 630" stroke="#4A5560" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="192" y="62" width="156" height="34" rx="8" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="270" y="84" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">MQTT broker</text><path d="M270 100 L270 630" stroke="#4A5560" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="392" y="62" width="156" height="52" rx="8" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="470" y="84" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">networkTask</text><text x="470" y="102" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">(core 0)</text><path d="M470 118 L470 630" stroke="#4A5560" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="572" y="62" width="156" height="34" rx="8" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="650" y="84" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">cmdQ</text><path d="M650 100 L650 630" stroke="#4A5560" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="752" y="62" width="156" height="52" rx="8" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="830" y="84" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">safety loop</text><text x="830" y="102" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">(core 1)</text><path d="M830 118 L830 630" stroke="#4A5560" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="912" y="62" width="156" height="34" rx="8" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="990" y="84" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">NVS</text><path d="M990 100 L990 630" stroke="#4A5560" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M90 165 L270 165" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><text x="180.0" y="156" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">publish DISARM:1001:&lt;tag&gt;</text><text x="180.0" y="180" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">tag = HMAC-SHA256(K, "DISARM:1001")[0:16]</text><path d="M270 220 L470 220" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><text x="370.0" y="211" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">deliver on command topic</text><rect x="392" y="250" width="156" height="54" rx="8" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="470" y="272" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">verifySigned()</text><text x="470" y="290" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ct_equal, constant time</text><path d="M470 340 L650 340" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><text x="560.0" y="331" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">enqueue {DISARM, authed, 1001}</text><path d="M650 385 L830 385" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><text x="740.0" y="376" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">dequeue, timeout 0</text><rect x="752" y="405" width="156" height="40" rx="8" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="830" y="430" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">1001 &gt; cmdCounter ?</text><path d="M830 480 L990 480" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><text x="910.0" y="471" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">persistCounter(1001)</text><text x="910.0" y="495" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">before acting, so a crash cannot replay</text><path d="M990 530 L830 530" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="910.0" y="521" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">ack</text><rect x="752" y="548" width="156" height="40" rx="8" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="830" y="573" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">disarm(): state := DISARMED</text><path d="M830 620 L470 620" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="650.0" y="611" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">event: disarmed</text><text x="530" y="668" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Dashed arrows are reporting, not control. The operator receives no direct acknowledgement:</text><text x="530" y="686" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">the outcome is inferred from the retained state topic and the event stream.</text></svg>