ll="none" stroke="#1B1F23" stroke-width="2"/><path d="M840 550 L800 550" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M800 550 L800 562" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M788 562 L812 562" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M792 567 L808 567" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M796 572 L804 572" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M840 670 L800 670" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M800 670 L800 682" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M788 682 L812 682" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M792 687 L808 687" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M796 692 L804 692" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M680 720 L740 720" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M740 720 L740 732" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M728 732 L752 732" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M732 737 L748 737" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M736 742 L744 742" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M40 810 L80 810" fill="none" stroke="#C0392B" stroke-width="2.4"/><text x="90" y="815" font-size="14" font-weight="normal" text-anchor="start" fill="#1B1F23">power</text><path d="M170 810 L210 810" fill="none" stroke="#1F4E9E" stroke-width="2.4"/><text x="220" y="815" font-size="14" font-weight="normal" text-anchor="start" fill="#1B1F23">signal</text><path d="M300 800 L300 812" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M288 812 L312 812" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M292 817 L308 817" fill="none" stroke="#1B1F23" stroke-width="2"/><path d="M296 822 L304 822" fill="none" stroke="#1B1F23" stroke-width="2"/><text x="325" y="815" font-size="14" font-weight="normal" text-anchor="start" fill="#1B1F23">ground (all tie to ESP32 GND)</text><text x="40" y="850" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">Door switch and button use INPUT_PULLUP: closed / pressed pulls the pin LOW.</text><text x="40" y="870" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">The PIR needs 5 V (VIN); its OUT pin is 3.3 V logic, so it is safe for the ESP32.</text><text x="40" y="890" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">Use a 220 ohm resistor in series with each LED. None of the pins used here is an</text><text x="40" y="910" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">ESP32 boot-strapping pin (GPIO0, 2, 5, 12 and 15 are avoided on purpose).</text></svg>