<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="772" viewBox="0 0 1100 772" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Hardware measurement rig for conditions A to D (not yet built)</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><g transform="translate(0,-10)"><text x="550" y="34" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">NOT YET BUILT AND NOT YET RUN. No number in the manuscript comes from this rig.</text><text x="550" y="58" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">The device under test never times itself: the hypothesis concerns its own clock under load, so a second board with an</text><text x="550" y="78" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">independent clock timestamps both edges.</text><rect x="60" y="104" width="400" height="196" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="2.2" stroke-dasharray="2 4"/><text x="260" y="132" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Device under test</text><text x="260" y="154" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ESP32-WROOM-32 DevKit (dual core)</text><text x="260" y="174" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">smart_home v2.2.0, AUTH_COMMANDS=1</text><text x="260" y="194" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">unmodified, not reflashed between conditions</text><rect x="84" y="216" width="160" height="72" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="164" y="240" font-size="17.5" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#1B1F23" font-weight="bold">GPIO 13</text><text x="164" y="260" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">PIR input</text><text x="164" y="280" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">(or push button)</text><rect x="276" y="216" width="160" height="72" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="356" y="240" font-size="17.5" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#1B1F23" font-weight="bold">GPIO 23</text><text x="356" y="260" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">buzzer output</text><text x="356" y="280" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">siren line</text><rect x="640" y="104" width="400" height="196" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="2.2" stroke-dasharray="2 4"/><text x="840" y="132" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Measuring instrument</text><text x="840" y="154" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">second ESP32, independent clock</text><text x="840" y="174" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">experiments/hardware/latency_probe</text><text x="840" y="194" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">rising-edge ISR, its own hardware timer</text><rect x="664" y="216" width="160" height="72" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="744" y="240" font-size="17.5" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#1B1F23" font-weight="bold">GPIO 34</text><text x="744" y="260" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">PIN_PIR_SENSE</text><text x="744" y="280" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">input only</text><rect x="856" y="216" width="160" height="72" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="936" y="240" font-size="17.5" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#1B1F23" font-weight="bold">GPIO 35</text><text x="936" y="260" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">PIN_BUZZ_SENSE</text><text x="936" y="280" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">input only</text><path d="M164 288 L164 326 L744 326 L744 288" fill="none" stroke="#2F3A45" stroke-width="2.2" marker-end="url(#arr)"/><text x="454" y="318" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">sensor edge  (t0)</text><path d="M356 288 L356 358 L936 358 L936 288" fill="none" stroke="#2F3A45" stroke-width="2.2" marker-end="url(#arr)"/><text x="646" y="350" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">siren edge  (t1)</text><rect x="386" y="384" width="328" height="44" rx="10" fill="#F1EAFB" stroke="#2F3A45" stroke-width="1.6"/><text x="550" y="412" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">common ground  —  required</text><path d="M100 288 L100 406 L386 406" fill="none" stroke="#2F3A45" stroke-width="1.8"/><path d="M1000 288 L1000 406 L714 406" fill="none" stroke="#2F3A45" stroke-width="1.8"/><rect x="60" y="448" width="980" height="76" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="550" y="474" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Measured quantity:  L = t1 − t0,  the confirmed sensor edge to the siren line going active</text><text x="550" y="498" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">One value per trial, in microseconds, timed entirely on the probe's clock. Written to results_hw.csv by collect.py.</text><rect x="60" y="544" width="980" height="140" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="550" y="570" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Four conditions, same firmware throughout</text><text x="84" y="600" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">A.</text><text x="112" y="600" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">idle, broker reachable, no other traffic — the control</text><text x="1016" y="600" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#4A5560">none</text><text x="84" y="622" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">B.</text><text x="112" y="622" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">legitimate MQTT load: frequent STATUS, large retained payloads</text><text x="1016" y="622" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#4A5560">none</text><text x="84" y="644" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">C.</text><text x="112" y="644" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">high-rate publication on the device's own command topic</text><text x="1016" y="644" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#4A5560">none</text><text x="84" y="666" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">D.</text><text x="112" y="666" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">802.11 deauthentication and disassociation frames at the device</text><text x="1016" y="666" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#C0392B">shielded enclosure + permission</text><text x="550" y="714" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">At least 50 samples per condition, 200 preferred: 200 detects a shift of about 0.29 standard deviations</text><text x="550" y="734" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">at the pre-registered two-sided Mann–Whitney U test, α = 0.05, power = 0.80.</text></g></svg>