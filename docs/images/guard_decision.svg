<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Compile-time guard for unauthenticated remote disarm</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="590" y="36" font-size="18" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">The compile guard, before and after</text><text x="590" y="60" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">A build condition is a security argument. This one asserted that transport security plus a broker login implies publisher authority.</text><rect x="36" y="100" width="554" height="560" rx="14" fill="#FDECEC" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="56" y="126" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">Before: the guard this work removed</text><rect x="150" y="150" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="310" y="178" font-size="11" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#1B1F23" font-weight="bold">ALLOW_REMOTE_DISARM = 1</text><path d="M310 196 L310 222" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M310 222.0 L460.0 258 L310 294.0 L160.0 258 z" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="310" y="254" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">AUTH_COMMANDS = 1 ?</text><path d="M460 258 L548 258 L548 440" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><text x="505" y="250" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32">yes</text><path d="M310 294 L310 322" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><text x="322" y="312" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#C0392B">no</text><path d="M310 329.0 L475.0 372 L310 415.0 L145.0 372 z" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/><text x="310" y="368" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">MQTT_USE_TLS = 1</text><text x="310" y="386" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">and MQTT_HAS_LOGIN = 1 ?</text><path d="M310 415 L310 446" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="96" y="446" width="428" height="60" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="310" y="470" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">compiles: any admitted DISARM is acted on</text><text x="310" y="490" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">the m.authed test is short-circuited</text><rect x="96" y="526" width="428" height="110" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 3"/><text x="310" y="550" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">Why the predicate cannot support the conclusion</text><text x="310" y="572" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">The broker terminates TLS and re-originates every message,</text><text x="310" y="587" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">so an arriving command carries no evidence of its publisher.</text><text x="310" y="602" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">MQTT_HAS_LOGIN describes this device's own build, not any</text><text x="310" y="617" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">publisher's authority. One leaked credential is sufficient.</text><rect x="626" y="100" width="518" height="560" rx="14" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="646" y="126" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">After</text><rect x="725" y="150" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="885" y="178" font-size="11" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#1B1F23" font-weight="bold">ALLOW_REMOTE_DISARM = 1</text><path d="M885 196 L885 222" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M885 222.0 L1035.0 258 L885 294.0 L735.0 258 z" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="885" y="254" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">AUTH_COMMANDS = 1 ?</text><path d="M1035 258 L1105 258 L1105 420" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><text x="1068" y="250" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32">yes</text><path d="M885 294 L885 322" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><text x="897" y="312" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">no</text><path d="M885 329.0 L1060.0 374 L885 419.0 L710.0 374 z" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="885" y="370" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">ACKNOWLEDGE_</text><text x="885" y="388" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">UNAUTHENTICATED_DISARM</text><text x="885" y="403" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">defined ?</text><path d="M885 419 L885 446" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="680" y="446" width="410" height="52" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="885" y="468" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">no: #error, the build is refused</text><text x="885" y="487" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">transport security is no longer accepted as authority</text><path d="M1060 374 L1105 374 L1105 420" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><text x="1115" y="400" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">yes</text><rect x="680" y="528" width="410" height="52" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="885" y="550" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">compiles: signed DISARM, or acknowledged risk</text><text x="885" y="569" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">the research baseline takes the second path</text><path d="M1105 420 L1105 554 L1094 554" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/></svg>