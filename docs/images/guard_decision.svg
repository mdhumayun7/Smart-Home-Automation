<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="692" viewBox="0 0 1180 692" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Compile-time guard for unauthenticated remote disarm</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><g transform="translate(0,-14)"><text x="590" y="34" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">A build condition is a security argument. This one asserted that transport security plus a broker login</text><text x="590" y="54" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">implies publisher authority.</text><rect x="36" y="100" width="554" height="560" rx="14" fill="#FDECEC" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="56" y="126" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">Before: the guard this work removed</text><rect x="153" y="150" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="313" y="178" font-size="16" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#1B1F23" font-weight="bold">ALLOW_REMOTE_DISARM = 1</text><path d="M313 196 L313 222" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M313 222.0 L463.0 258 L313 294.0 L163.0 258 z" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="313" y="254" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">AUTH_COMMANDS = 1 ?</text><path d="M463 258 L548 258 L548 440" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><text x="506" y="250" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32">yes</text><path d="M313 294 L313 322" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><text x="325" y="312" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#C0392B">no</text><path d="M313 329.0 L478.0 372 L313 415.0 L148.0 372 z" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/><text x="313" y="368" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">MQTT_USE_TLS = 1</text><text x="313" y="386" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">and MQTT_HAS_LOGIN = 1 ?</text><path d="M313 415 L313 446" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="446" width="506" height="60" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6"/><text x="313" y="470" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">compiles: any admitted DISARM is acted on</text><text x="313" y="490" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">the m.authed test is short-circuited</text><rect x="44" y="526" width="538" height="110" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 3"/><text x="313" y="550" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B" font-weight="bold">Why the predicate cannot support the conclusion</text><text x="313" y="572" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">The broker terminates TLS and re-originates every message,</text><text x="313" y="592" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">so an arriving command carries no evidence of its publisher.</text><text x="313" y="612" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">MQTT_HAS_LOGIN describes this device's own build, not any</text><text x="313" y="632" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">publisher's authority. One leaked credential is sufficient.</text><rect x="626" y="100" width="518" height="560" rx="14" fill="#E9F7EF" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="7 5"/><text x="646" y="126" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">After</text><rect x="715" y="150" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="875" y="178" font-size="16" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#1B1F23" font-weight="bold">ALLOW_REMOTE_DISARM = 1</text><path d="M875 196 L875 222" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M875 222.0 L1025.0 258 L875 294.0 L725.0 258 z" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="875" y="254" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">AUTH_COMMANDS = 1 ?</text><path d="M1025 258 L1120 258 L1120 420" fill="none" stroke="#2E7D32" stroke-width="1.8"/><text x="1070" y="250" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32">yes</text><path d="M875 294 L875 322" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><text x="887" y="312" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#4A5560">no</text><path d="M875 322.0 L1090.0 374 L875 426.0 L660.0 374 z" fill="#FFFFFF" stroke="#2F3A45" stroke-width="1.6"/><text x="875" y="370" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">ACKNOWLEDGE_</text><text x="875" y="388" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">UNAUTHENTICATED_DISARM</text><text x="875" y="408" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">defined ?</text><path d="M875 426 L875 446" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><rect x="650" y="446" width="450" height="52" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="875" y="468" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">no: #error, the build is refused</text><text x="875" y="487" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32">transport security is no longer accepted as authority</text><path d="M1090 374 L1120 374 L1120 420" fill="none" stroke="#2F3A45" stroke-width="1.8"/><text x="1114" y="366" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#4A5560">yes</text><rect x="650" y="528" width="450" height="52" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.6"/><text x="875" y="550" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#2E7D32" font-weight="bold">compiles: signed DISARM, or acknowledged risk</text><text x="875" y="569" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">the research baseline takes the second path</text><path d="M1120 420 L1120 554 L1104 554" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arr)"/><text x="590" y="684" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Red marks a build in which an unauthenticated DISARM can be acted on; green marks one in which it cannot.</text></g></svg>