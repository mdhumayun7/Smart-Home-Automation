<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"><title>Event delivery and command sequence</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><line x1="85" y1="100" x2="85" y2="830" stroke="#98A2B3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="15" y="40" width="140" height="60" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="1.8"/><text x="85" y="64" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B1F23">PIR / door</text><text x="85" y="84" font-size="12" font-weight="normal" text-anchor="middle" fill="#33393F">sensor</text><line x1="250" y1="100" x2="250" y2="830" stroke="#98A2B3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="180" y="40" width="140" height="60" rx="10" fill="#E9F7EF" stroke="#2E7D32" stroke-width="1.8"/><text x="250" y="64" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B1F23">Safety loop</text><text x="250" y="84" font-size="12" font-weight="normal" text-anchor="middle" fill="#33393F">core 1</text><line x1="415" y1="100" x2="415" y2="830" stroke="#98A2B3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="345" y="40" width="140" height="60" rx="10" fill="#F1EAFB" stroke="#6B46C1" stroke-width="1.8"/><text x="415" y="64" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B1F23">Event queue</text><text x="415" y="84" font-size="12" font-weight="normal" text-anchor="middle" fill="#33393F">16 deep</text><line x1="580" y1="100" x2="580" y2="830" stroke="#98A2B3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="510" y="40" width="140" height="60" rx="10" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.8"/><text x="580" y="64" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B1F23">Network task</text><text x="580" y="84" font-size="12" font-weight="normal" text-anchor="middle" fill="#33393F">core 0</text><line x1="745" y1="100" x2="745" y2="830" stroke="#98A2B3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="675" y="40" width="140" height="60" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.8"/><text x="745" y="76" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B1F23">MQTT broker</text><line x1="910" y1="100" x2="910" y2="830" stroke="#98A2B3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="840" y="40" width="140" height="60" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.8"/><text x="910" y="64" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B1F23">Client</text><text x="910" y="84" font-size="12" font-weight="normal" text-anchor="middle" fill="#33393F">phone / Node-RED</text><path d="M85 150 L250 150" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="167.5" y="142" font-size="13" font-weight="normal" text-anchor="middle" fill="#1B1F23">motion confirmed</text><path d="M250 200 L295 200 L295 224 L250 224" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="305" y="217" font-size="13" font-weight="normal" text-anchor="start" fill="#1B1F23">to ENTRY_DELAY</text><path d="M250 280 L415 280" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="332.5" y="272" font-size="13" font-weight="normal" text-anchor="middle" fill="#1B1F23">enqueue events</text><text x="332" y="300" font-size="12" font-weight="normal" text-anchor="middle" fill="#4A5560">never blocks</text><path d="M580 350 L415 350" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="497.5" y="342" font-size="13" font-weight="normal" text-anchor="middle" fill="#1B1F23">take oldest event</text><path d="M580 400 L745 400" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="662.5" y="392" font-size="13" font-weight="normal" text-anchor="middle" fill="#1B1F23">PUBLISH .../event</text><path d="M745 450 L910 450" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="827.5" y="442" font-size="13" font-weight="normal" text-anchor="middle" fill="#1B1F23">event JSON (with seq)</text><path d="M580 500 L415 500" fill="none" stroke="#2F3A45" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="497.5" y="492" font-size="13" font-weight="normal" text-anchor="middle" fill="#1B1F23">link lost: put back at front</text><rect x="330" y="530" width="340" height="82" rx="10" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.6" stroke-dasharray="6 4"/><text x="345" y="552" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">If the broker is unreachable, events stay</text><text x="345" y="570" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">queued (16 deep; when full the oldest is</text><text x="345" y="588" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">dropped and counted) and are sent in</text><text x="345" y="606" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">order after reconnection.</text><path d="M910 670 L745 670" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="827.5" y="662" font-size="13" font-weight="normal" text-anchor="middle" fill="#1B1F23">cmd: ARM</text><path d="M745 720 L580 720" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="662.5" y="712" font-size="13" font-weight="normal" text-anchor="middle" fill="#1B1F23">message on .../cmd</text><path d="M580 770 L250 770" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="415.0" y="762" font-size="13" font-weight="normal" text-anchor="middle" fill="#1B1F23">command queue (4 deep)</text><path d="M250 800 L295 800 L295 822 L250 822" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="305" y="812" font-size="13" font-weight="normal" text-anchor="start" fill="#1B1F23">ARM accepted if DISARMED; DISARM refused</text></svg>