<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Research methodology workflow</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="550" y="34" font-size="18" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Research methodology</text><text x="550" y="56" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Four evidence routes. Three are complete; the fourth is specified and unrun, and it is the one the headline claim needs.</text><rect x="60" y="90" width="220" height="90" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="170" y="118" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Research question</text><text x="170" y="138" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Does core pinning isolate</text><text x="170" y="153" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">the safety function when the</text><text x="170" y="168" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">on-die radio is attacked?</text><rect x="60" y="210" width="220" height="90" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="170" y="236" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Literature gap</text><text x="170" y="256" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">14 works verified against</text><text x="170" y="271" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">publisher records.</text><text x="170" y="286" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">No prior work measures it.</text><path d="M170 180 L170 210" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><rect x="350" y="150" width="165" height="140" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="432" y="178" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Formal</text><text x="432" y="200" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">2 TLA+ models, TLC</text><text x="432" y="215" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">25 and 660 states</text><text x="432" y="230" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">mutation-tested</text><text x="432" y="268" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">COMPLETE</text><path d="M315 240 L315 120 L432 120 L432 150" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><rect x="535" y="150" width="165" height="140" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="617" y="178" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Simulation</text><text x="617" y="200" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">6,000 seeded trials</text><text x="617" y="215" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">0 attacker disarms</text><text x="617" y="230" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">0 violations</text><text x="617" y="268" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">COMPLETE</text><path d="M315 240 L315 120 L617 120 L617 150" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><rect x="720" y="150" width="165" height="140" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="802" y="178" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Fuzzing</text><text x="802" y="200" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">3,000,000 iterations</text><text x="802" y="215" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ASan + UBSan</text><text x="802" y="230" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">0 accepted inputs</text><text x="802" y="268" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">COMPLETE</text><path d="M315 240 L315 120 L802 120 L802 150" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><rect x="905" y="150" width="165" height="140" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="6 4"/><text x="987" y="178" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Hardware</text><text x="987" y="200" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Conditions A-D</text><text x="987" y="215" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">latency distributions</text><text x="987" y="230" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">apparatus built</text><text x="987" y="268" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">NOT RUN</text><path d="M315 240 L315 120 L987 120 L987 150" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M280 240 L315 240" fill="none" stroke="#2F3A45" stroke-width="1.8"/><rect x="350" y="330" width="710" height="90" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="705" y="358" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">What the three complete routes establish</text><text x="705" y="380" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">LOGICAL isolation: no code path makes the safety response depend on network input,</text><text x="705" y="395" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">and the authenticated command path rejects every forged, stale and malformed input.</text><path d="M432 290 L432 330" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M617 290 L617 330" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><path d="M802 290 L802 330" fill="none" stroke="#2F3A45" stroke-width="1.8" marker-end="url(#arr)"/><rect x="350" y="450" width="710" height="80" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="6 4"/><text x="705" y="478" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">What remains open</text><text x="705" y="500" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">TIMING isolation: a property of the silicon, the interrupt controller and the closed-source</text><text x="705" y="515" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">radio driver. It cannot be simulated, and no latency number is claimed anywhere.</text><path d="M987 290 L987 450" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/></svg>