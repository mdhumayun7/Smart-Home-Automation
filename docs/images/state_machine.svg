<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"><title>State transition diagram of the alarm controller</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><rect x="290" y="70" width="590" height="420" rx="16" fill="#FAFAFB" stroke="#98A2B3" stroke-width="1.6" stroke-dasharray="7 5"/><text x="305" y="94" font-size="13" font-weight="normal" text-anchor="start" fill="#4A5560">any state other than DISARMED</text><rect x="15.0" y="165.0" width="170" height="70" rx="14" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/><text x="100" y="196" font-size="17" font-weight="bold" text-anchor="middle" fill="#1B1F23">DISARMED</text><text x="100" y="218" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">sensors ignored</text><rect x="305.0" y="165.0" width="170" height="70" rx="14" fill="#FFF4E0" stroke="#B26A00" stroke-width="2"/><text x="390" y="196" font-size="17" font-weight="bold" text-anchor="middle" fill="#1B1F23">EXIT_DELAY</text><text x="390" y="218" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">sensors ignored</text><rect x="615.0" y="165.0" width="170" height="70" rx="14" fill="#E9F7EF" stroke="#2E7D32" stroke-width="2"/><text x="700" y="196" font-size="17" font-weight="bold" text-anchor="middle" fill="#1B1F23">ARMED</text><text x="700" y="218" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">PIR and door active</text><rect x="615.0" y="365.0" width="170" height="70" rx="14" fill="#FFF4E0" stroke="#B26A00" stroke-width="2"/><text x="700" y="396" font-size="17" font-weight="bold" text-anchor="middle" fill="#1B1F23">ENTRY_DELAY</text><text x="700" y="418" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">fast warning beeps</text><rect x="305.0" y="365.0" width="170" height="70" rx="14" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text x="390" y="396" font-size="17" font-weight="bold" text-anchor="middle" fill="#1B1F23">ALARM</text><text x="390" y="418" font-size="13" font-weight="normal" text-anchor="middle" fill="#33393F">siren, red LED</text><circle cx="100" cy="100" r="7" fill="#1B1F23"/><path d="M100 107 L100 165" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="114" y="118" font-size="13" font-weight="normal" text-anchor="start" fill="#4A5560">boot</text><path d="M185 200 L305 200" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="245" y="172" font-size="13" font-weight="normal" text-anchor="middle" fill="#4A5560">ARM button</text><text x="245" y="188" font-size="13" font-weight="normal" text-anchor="middle" fill="#4A5560">or remote ARM</text><path d="M475 200 L615 200" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="545" y="190" font-size="13" font-weight="normal" text-anchor="middle" fill="#4A5560">10 s elapsed</text><path d="M700 235 L700 365" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="712" y="292" font-size="13" font-weight="normal" text-anchor="start" fill="#4A5560">PIR rising edge</text><text x="712" y="310" font-size="13" font-weight="normal" text-anchor="start" fill="#4A5560">or door opened</text><path d="M615 400 L475 400" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="545" y="390" font-size="13" font-weight="normal" text-anchor="middle" fill="#4A5560">10 s elapsed</text><path d="M450 365 L450 300 L660 300 L660 235" fill="none" stroke="#2F3A45" stroke-width="2" marker-end="url(#arr)"/><text x="555" y="292" font-size="13" font-weight="normal" text-anchor="middle" fill="#4A5560">30 s elapsed</text><path d="M290 300 L100 300 L100 235" fill="none" stroke="#2B6CB0" stroke-width="2" marker-end="url(#arr)"/><text x="195" y="290" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B6CB0">button press</text><text x="195" y="322" font-size="12" font-weight="normal" text-anchor="middle" fill="#4A5560">remote DISARM is refused</text><text x="305" y="462" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">If the door is still open when the exit delay ends,</text><text x="305" y="480" font-size="13" font-weight="normal" text-anchor="start" fill="#33393F">ENTRY_DELAY starts immediately after ARMED.</text></svg>