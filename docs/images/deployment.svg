t x="665" y="160" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Last Will, retained state</text><text x="665" y="180" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">alarm works offline</text><rect x="540" y="240" width="250" height="110" rx="10" fill="#E8F1FB" stroke="#2F3A45" stroke-width="1.6"/><text x="665" y="266" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Home Assistant</text><text x="665" y="288" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">auto-configured by</text><text x="665" y="308" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">retained discovery</text><text x="665" y="328" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">OPTIONAL consumer</text><rect x="540" y="380" width="250" height="100" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="6 4"/><text x="665" y="406" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Second ESP32</text><text x="665" y="428" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">espnow_receiver</text><text x="665" y="448" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">signed fallback alerts</text><text x="665" y="468" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">when MQTT is unreachable</text><rect x="850" y="90" width="210" height="390" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="955" y="118" font-size="19.5" font-family='