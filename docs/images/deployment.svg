<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Deployment architecture</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="550" y="34" font-size="22" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Deployment architecture</text><text x="550" y="56" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Solid: required. Dashed: optional, compiles in CI, never run on hardware. Dotted: experiment apparatus, never run.</text><rect x="60" y="90" width="400" height="250" rx="10" fill="#E9F7EF" stroke="#2F3A45" stroke-width="2.2"/><text x="260" y="118" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">ESP32 DevKit  —  alarm device</text><text x="260" y="140" font-size="16" font-family='"DejaVu Sans Mono", monospace' text-anchor="middle" fill="#4A5560">firmware/smart_home  (v2.2.0)</text><rect x="80" y="162" width="360" height="46" rx="8" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="260" y="183" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Core 1: FSM, siren, OLED</text><text x="260" y="200" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">safety domain</text><rect x="80" y="218" width="360" height="46" rx="8" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6"/><text x="260" y="239" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Core 0: Wi-Fi, MQTT, HMAC</text><text x="