<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="614" viewBox="0 0 1100 614" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Experimental setup: completed evidence against the hardware rig</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><g transform="translate(0,-46)"><rect x="50" y="70" width="500" height="570" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="2.2"/><text x="300" y="96" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">A.  Completed evidence</text><text x="300" y="116" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">every result reported in this paper</text><rect x="80" y="134" width="440" height="104" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="300" y="158" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Unmodified firmware logic</text><text x="300" y="180" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">smart_home.ino compiled against host stubs</text><text x="300" y="200" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">for Arduino, FreeRTOS, WiFi, MQTT, NVS, OLED.</text><text x="300" y="220" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Not altered for testing.</text><rect x="80" y="252" width="212" height="96" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="186" y="276" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Campaign (E1, E2)</text><text x="186" y="296" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">6,000 trials, seed 1000</text><text x="186" y="316" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">rates 0 to 20,000 msg/s</text><text x="186" y="336" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">fork() per trial</text><rect x="308" y="252" width="212" height="96" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="414" y="276" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Ablation (E3)</text><text x="414" y="296" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">3,600 trials, seed 2000</text><text x="414" y="316" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">12 configurations</text><text x="414" y="336" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">300 trials each</text><rect x="80" y="364" width="212" height="96" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="186" y="388" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Fuzzer (E4)</text><text x="186" y="408" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">3,000,000 iterations</text><text x="186" y="428" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">seed 7, 6 input classes</text><text x="186" y="448" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ASan + UBSan</text><rect x="308" y="364" width="212" height="96" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="414" y="388" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Broker testbed (E6)</text><text x="414" y="408" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">real Mosquitto 2.0.18</text><text x="414" y="428" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">TLS, per-client ACLs</text><text x="414" y="448" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">8 scenarios</text><rect x="80" y="476" width="440" height="66" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="300" y="500" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Sensitivity sweep (E5) and corpus study</text><text x="300" y="520" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">180 grid cells; 135 projects, commit-pinned,</text><text x="300" y="540" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">guard rule with 8 controls, 0 hits</text><rect x="80" y="556" width="440" height="78" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="300" y="578" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Limitation that defines the open step</text><text x="300" y="598" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">The harness advances a logical clock. No radio,</text><text x="300" y="618" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">no parallelism, no contention: zero variance.</text><rect x="570" y="70" width="480" height="570" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="2.2" stroke-dasharray="2 4"/><text x="810" y="96" font-size="19.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">B.  Not yet measured</text><text x="810" y="116" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#C0392B">rig specified; no result in this paper comes from it</text><rect x="598" y="134" width="188" height="96" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="692" y="160" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Device under test</text><text x="692" y="180" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ESP32 DevKit</text><text x="692" y="200" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">running v2.2.0</text><text x="692" y="220" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">unmodified</text><rect x="834" y="134" width="188" height="96" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="928" y="160" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Measuring board</text><text x="928" y="180" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">second ESP32,</text><text x="928" y="200" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">independent clock,</text><text x="928" y="220" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">logic probe</text><path d="M788 186 L832 186" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#arr)"/><text x="810" y="172" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">GPIO</text><rect x="600" y="256" width="420" height="132" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="810" y="280" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Four conditions</text><text x="620" y="306" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">A.</text><text x="648" y="306" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">idle (control)</text><text x="620" y="328" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">B.</text><text x="648" y="328" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">legitimate network load</text><text x="620" y="350" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">C.</text><text x="648" y="350" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">command-interface stress</text><text x="620" y="372" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">D.</text><text x="648" y="372" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">radio-layer stress</text><text x="810" y="408" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">A to C need no RF isolation.</text><text x="810" y="428" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">D: authorised, isolated RF environment only.</text><rect x="600" y="444" width="420" height="84" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="810" y="468" font-size="17.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Dependent variable</text><text x="810" y="490" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Physical sensor-to-siren latency distribution,</text><text x="810" y="510" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">compared across conditions with analyse_hw.py.</text><rect x="600" y="546" width="420" height="66" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="810" y="572" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">Conditions A to C need two boards and a probe.</text><text x="810" y="592" font-size="16" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23">No attack tooling is published.</text></g></svg>