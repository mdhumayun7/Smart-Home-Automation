<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family='DejaVu Sans, Arial, Helvetica, sans-serif'><title>Experimental setup</title><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F3A45"/></marker></defs><text x="550" y="34" font-size="18" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Experimental setup</text><rect x="50" y="70" width="500" height="500" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="2.2"/><text x="300" y="98" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">A.  Simulation harness  —  USED FOR ALL COMMITTED RESULTS</text><rect x="80" y="120" width="440" height="100" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="300" y="146" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Unmodified firmware logic</text><text x="300" y="168" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">smart_home.ino compiled against host stubs for Arduino,</text><text x="300" y="183" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">FreeRTOS, WiFi, MQTT, NVS and the OLED. The firmware</text><text x="300" y="198" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">source is not altered for testing.</text><rect x="80" y="240" width="205" height="120" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="182" y="266" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Campaign</text><text x="182" y="288" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">6,000 trials</text><text x="182" y="303" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">seed base 1000</text><text x="182" y="318" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">rates 0 to 20,000</text><text x="182" y="333" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">msg/s</text><text x="182" y="348" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">fork() per trial</text><rect x="315" y="240" width="205" height="120" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="417" y="266" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Fuzzer</text><text x="417" y="288" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">3,000,000 iters</text><text x="417" y="303" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">seed 7, 6 classes</text><text x="417" y="318" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ASan + UBSan</text><text x="417" y="333" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">oracle: no state</text><text x="417" y="348" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">change, no counter</text><rect x="80" y="380" width="440" height="80" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="300" y="406" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Limitation that defines the open step</text><text x="300" y="428" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">The harness advances a logical clock. There is no radio, no true</text><text x="300" y="443" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">parallel execution and no CPU contention, so latency variance is zero.</text><rect x="80" y="480" width="440" height="70" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6"/><text x="300" y="506" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Analysis</text><text x="300" y="526" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">analyse.py: aggregation, Mann-Whitney U with tie correction,</text><text x="300" y="541" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">standard library only. make_figures.py: validated palette.</text><rect x="570" y="70" width="480" height="500" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="2.2" stroke-dasharray="2 4"/><text x="810" y="98" font-size="15" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">B.  Hardware rig  —  SPECIFIED, NOT YET RUN</text><rect x="600" y="120" width="190" height="90" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="695" y="148" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Device under test</text><text x="695" y="168" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">ESP32 DevKit</text><text x="695" y="183" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">running v2.2.0</text><text x="695" y="198" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">unmodified</text><rect x="830" y="120" width="190" height="90" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="925" y="148" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Measuring board</text><text x="925" y="168" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">second ESP32,</text><text x="925" y="183" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">independent clock,</text><text x="925" y="198" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">logic probe</text><path d="M790 150 L830 150" fill="none" stroke="#2F3A45" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#arr)"/><text x="810" y="136" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">GPIO</text><rect x="600" y="240" width="420" height="150" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="810" y="266" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Four conditions</text><text x="620" y="290" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">A.</text><text x="645" y="290" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">idle (control)</text><text x="1000" y="290" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#4A5560">no RF isolation</text><text x="620" y="314" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">B.</text><text x="645" y="314" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">legitimate network load</text><text x="1000" y="314" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#4A5560">no RF isolation</text><text x="620" y="338" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">C.</text><text x="645" y="338" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">command-interface stress</text><text x="1000" y="338" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#4A5560">no RF isolation</text><text x="620" y="362" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23" font-weight="bold">D.</text><text x="645" y="362" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="start" fill="#1B1F23">radio-layer stress</text><text x="1000" y="362" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="end" fill="#4A5560">AUTHORISED ISOLATED RF ONLY</text><rect x="600" y="410" width="420" height="80" rx="10" fill="#DCE3EA" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="2 4"/><text x="810" y="436" font-size="12.5" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">Dependent variable</text><text x="810" y="458" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">Physical sensor-to-siren latency distribution, compared across</text><text x="810" y="473" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#4A5560">conditions with the same non-parametric test (analyse_hw.py).</text><rect x="600" y="510" width="420" height="40" rx="10" fill="#F4F6F8" stroke="#2F3A45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="810" y="535" font-size="11" font-family='DejaVu Sans, Arial, Helvetica, sans-serif' text-anchor="middle" fill="#1B1F23" font-weight="bold">A to C need two boards and a probe. No attack tooling is published.</text></svg>